services:
  db:
    image: postgres:16
    container_name: saldook_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in the project .env}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS must be set in the project .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in the project .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: saldook_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@localhost}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASS:?DB_PASS must be set in the project .env}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: